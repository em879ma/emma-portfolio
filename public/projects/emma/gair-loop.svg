<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#fefaf0"/><g font-family="sans-serif" fill="#542916"><text x="65" y="75" font-size="38">Iterative enhancement loop</text><rect x="70" y="135" width="450" height="220" rx="12" fill="#eee0c5"/><text x="95" y="180" font-size="24">01</text><text x="95" y="235" font-size="30">Benchmark evaluation</text><text x="95" y="285" font-size="23">Run tests; identify weaknesses</text><rect x="680" y="135" width="450" height="220" rx="12" fill="#eee0c5"/><text x="705" y="180" font-size="24">02</text><text x="705" y="235" font-size="30">Error analysis</text><text x="705" y="285" font-size="23">Locate reasoning gaps</text><rect x="680" y="475" width="450" height="220" rx="12" fill="#eee0c5"/><text x="705" y="520" font-size="24">03</text><text x="705" y="575" font-size="30">Data selection</text><text x="705" y="625" font-size="23">Target the weak points</text><rect x="70" y="475" width="450" height="220" rx="12" fill="#eee0c5"/><text x="95" y="520" font-size="24">04</text><text x="95" y="575" font-size="30">Model &amp; prompt iteration</text><text x="95" y="625" font-size="23">Refine and evaluate again</text><path d="M540 240H650 M905 375V450 M650 590H540 M295 450V375" stroke="#a13a1e" stroke-width="7" fill="none"/></g></svg>