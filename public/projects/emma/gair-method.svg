<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#fefaf0"/><rect x="80" y="90" width="10" height="810" fill="#a13a1e"/><text x="140" y="160" fill="#785b3f" font-family="sans-serif" font-size="26">RESEARCH METHOD  /  SCHEMATIC</text><text x="140" y="280" fill="#542916" font-family="Georgia, serif" font-size="68">A repeatable evaluation loop</text><rect x="140" y="385" width="1310" height="135" rx="10" fill="#f3e6cc"/><text x="180" y="439" fill="#542916" font-family="sans-serif" font-size="32">1. Define the task</text><text x="180" y="485" fill="#785b3f" font-family="sans-serif" font-size="25">Subject-specific benchmarks from public exams</text><rect x="140" y="550" width="1310" height="135" rx="10" fill="#e7eef0"/><text x="180" y="604" fill="#542916" font-family="sans-serif" font-size="32">2. Check the answers</text><text x="180" y="650" fill="#785b3f" font-family="sans-serif" font-size="25">Regex + AI graders + human score validation</text><rect x="140" y="715" width="1310" height="135" rx="10" fill="#efe0d5"/><text x="180" y="769" fill="#542916" font-family="sans-serif" font-size="32">3. Investigate failures</text><text x="180" y="815" fill="#785b3f" font-family="sans-serif" font-size="25">Reasoning bottlenecks inform the next prompt</text></svg>